name: Release Artifacts

# Cuts a contract's canonical WASM. This is the *only* way a release blob is
# produced — there is no manual step to forget.
#
# On a contract release tag: build the contract in the pinned NEP-330 Docker
# image at that tag's own commit, upload the WASM plus a `checksums.txt` to the
# GitHub Release, then open a PR recording the release and its SHA-256 in
# `ids.rs`.
#
# ## Why the build happens here and not on a laptop
#
# `cargo near build reproducible-wasm` embeds its source commit into the WASM
# (NEP-330 `source_code_snapshot`). Verifiers such as nearblocks.io read that
# commit back out, clone the repo at it, and rebuild. So the commit has to stay
# permanently reachable — and a squash-merged feature branch does not: it never
# becomes an ancestor of `dev` and is eventually garbage-collected.
#
# A tag is reachable from a fresh `git clone` forever. Building here means the
# embedded commit *is* the release tag's commit, so anyone can reproduce with:
#
#   git clone <repo> && git checkout <tag>
#   cargo near build reproducible-wasm --manifest-path <source_path>/Cargo.toml
#
# ## Why the catalog entry lands in a follow-up PR
#
# The catalog records what was *released*, and nothing a developer writes before
# the fact can assert that — contract versions have repeatedly been bumped
# during development and never deployed. So CI appends the entry afterwards,
# with the hash of the bytes it just built. (It could not be written earlier
# anyway: the hash of a reproducible build cannot be known inside the commit
# that produces it, since writing it in would change that commit.)
#
# Nothing is left for a developer to remember.

on:
  push:
    tags:
      # Broad glob: catalog membership is decided in `ids.rs`, not here. A
      # tagged package the catalog doesn't know about exits cleanly below.
      - "*-contract-v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  release-artifact:
    name: Build and publish the release WASM
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # attach assets to the GitHub Release
      pull-requests: write # open the catalog PR
    steps:
      - name: Checkout the tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # The reproducible build reads committed git state, and the catalog
          # PR needs `dev` present to branch from.
          fetch-depth: 0
          persist-credentials: false

      # Not `./.github/actions/rust`: the WASM build runs inside the cargo-near
      # Docker image, so a host rust-cache entry for this job would be cold on
      # every release tag and just add eviction pressure.
      - uses: dtolnay/rust-toolchain@dd44c20b1206a46e25fba8503d5d7c9a33bd355a
        with:
          toolchain: "1.86.0"
          components: rustfmt

      - name: Resolve the artifact from the tag
        id: catalog
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The tag is parsed in Rust, by the tested inverse of the function that
          # builds it — not pulled apart with parameter expansion here, which
          # nothing checks against the catalog or against release-plz's template.
          #
          # Exit code 2 means "not a catalogued NEAR artifact" (a Soroban tag,
          # say) as opposed to a genuine failure. Distinguishing them is the
          # point: printing nothing for both would let a broken lookup green a
          # release that has no WASM.
          status=0
          resolved=$(cargo run --quiet -p templar-contract-artifacts \
            --features workspace-loader,clap --bin prebuild-test-contracts -- \
            --resolve "$REF_NAME") || status=$?

          if [ "$status" -eq 2 ]; then
            echo "::notice::${REF_NAME} has no catalogued WASM artifact; nothing to build."
            exit 0
          elif [ "$status" -ne 0 ]; then
            echo "::error::could not resolve ${REF_NAME} against the artifact catalog." >&2
            exit "$status"
          fi

          {
            echo "$resolved"
            echo "build=true"
          } >> "$GITHUB_OUTPUT"

      - name: Install cargo-near
        if: steps.catalog.outputs.build == 'true'
        uses: taiki-e/install-action@cde8c9e634f4a17bc06b61413ac0ef75450eac46
        with:
          tool: cargo-near

      - name: Build reproducibly at the tag
        id: build
        if: steps.catalog.outputs.build == 'true'
        env:
          SOURCE_PATH: ${{ steps.catalog.outputs.source_path }}
          TARGET: ${{ steps.catalog.outputs.target }}
          VERSION: ${{ steps.catalog.outputs.version }}
          # From the catalog, not rebuilt here: the asset name is the same
          # convention the downloader resolves, so it has one home.
          ASSET: ${{ steps.catalog.outputs.asset }}
        run: |
          set -euo pipefail
          cargo near build reproducible-wasm --manifest-path "${SOURCE_PATH}/Cargo.toml"

          built="target/near/${TARGET}/${TARGET}.wasm"
          mkdir -p dist
          cp "$built" "dist/${ASSET}"
          (cd dist && sha256sum ./*.wasm > checksums.txt)

          sha=$(sha256sum "$built" | cut -d' ' -f1)
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"
          echo "Built ${TARGET} ${VERSION} at $(git rev-parse HEAD): ${sha}"

      - name: Attach the WASM to the release
        if: steps.catalog.outputs.build == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # release-plz creates the tag and the GitHub Release moments apart, and
          # this job races the tag push. Wait for the release rather than failing
          # a build that succeeded.
          for attempt in 1 2 3 4 5; do
            if gh release view "$REF_NAME" >/dev/null 2>&1; then
              gh release upload "$REF_NAME" dist/* --clobber
              exit 0
            fi
            echo "Release $REF_NAME not published yet (attempt ${attempt}); waiting."
            sleep 15
          done
          echo "::error::Release $REF_NAME never appeared; cannot attach the WASM." >&2
          exit 1

      # The hash is taken from the bytes this job just built, so the catalog
      # entry attests the CI build output rather than a re-download.
      - name: Open the catalog PR
        if: steps.catalog.outputs.build == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          PACKAGE: ${{ steps.catalog.outputs.package }}
          VERSION: ${{ steps.catalog.outputs.version }}
          SOURCE_PATH: ${{ steps.catalog.outputs.source_path }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch="record/${REF_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch" origin/dev

          # Same feature set as the catalog lookup above: a different one is a
          # different compilation unit, and this job has no rust-cache, so it
          # would recompile the crate from cold rather than relink.
          cargo run --quiet -p templar-contract-artifacts \
            --features workspace-loader,clap --bin record-release -- \
            "$PACKAGE" "$VERSION" "$SHA256"
          cargo fmt -p templar-contract-artifacts

          if git diff --quiet; then
            echo "::notice::${PACKAGE} ${VERSION} is already in the catalog; no PR needed."
            exit 0
          fi

          git add contract/artifacts/src/ids.rs
          git commit -m "chore(artifacts): record ${PACKAGE} ${VERSION} release"
          # `persist-credentials: false` above, so authenticate the push here
          # instead of leaving a credential in the runner's git config.
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$branch"

          body=$(printf '%s\n' \
            "Records the release of \`${PACKAGE}\` ${VERSION}, built for" \
            "\`${REF_NAME}\`:" \
            "" \
            "    ${SHA256}" \
            "" \
            "Until this merges, \`templar-contract-artifacts\` will not serve" \
            "${PACKAGE} ${VERSION} — an unrecorded version has no reviewed hash to" \
            "check downloaded bytes against." \
            "" \
            "Reproduce the bytes from a fresh clone:" \
            "" \
            "    git checkout ${REF_NAME}" \
            "    cargo near build reproducible-wasm --manifest-path ${SOURCE_PATH}/Cargo.toml")

          gh pr create \
            --base dev \
            --head "$branch" \
            --title "chore(artifacts): record ${PACKAGE} ${VERSION} release" \
            --body "$body"
