name: Release-plz

# `release-plz-pr` maintains the standing "chore: release" PR; `release-plz`
# tags and cuts GitHub Releases once it merges. Merging that PR is the only
# release trigger. See RELEASING.md, and `release-plz.toml` for tiers.

on:
  push:
    branches: [dev]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The workspace has sqlx macros; without this, any cargo invocation that
  # builds `service/relayer` or `gateway/store` wants a live database.
  SQLX_OFFLINE: "true"

jobs:
  # Guarded once for both jobs: without the PAT a release ships past its gates.
  require-token:
    name: Require RELEASE_PLZ_TOKEN
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::RELEASE_PLZ_TOKEN is required (a PAT so the release PR and tags trigger CI). See RELEASING.md." >&2
            exit 1
          fi

  release-plz-release:
    name: Release
    needs: require-token
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags and GitHub Releases
      pull-requests: read # release-plz checks for an existing release PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # release-plz derives each crate's current version from its git tags,
          # so it needs the full history, not a shallow clone.
          fetch-depth: 0
          persist-credentials: false

      # No wasm is compiled on the host in these jobs.
      - uses: ./.github/actions/rust
        with:
          targets: ""

      - name: Run release-plz
        id: release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # `release-baseline` is the released tree the Release PR job diffs against
      # — see the comment on its worktree step below. Moving it only when
      # something actually released is what keeps it a lower bound: advancing it
      # over a no-op push would mark unreleased work as shipped, and those
      # commits would never reach a changelog or move a version again.
      - name: Advance the released-tree baseline
        if: steps.release.outputs.releases_created == 'true'
        env:
          TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          set -euo pipefail
          git tag --force release-baseline "$GITHUB_SHA"
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" \
            refs/tags/release-baseline

  release-plz-pr:
    name: Release PR
    needs: require-token
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Never let two runs race on the same release branch: one would force-push
    # over the other's bumps. Queue instead of cancelling, so the last push to
    # `dev` is always reflected in the PR.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      # No wasm is compiled on the host in these jobs.
      - uses: ./.github/actions/rust
        with:
          targets: ""

      # release-plz decides what changed by diffing each crate against its
      # released source. It normally downloads that from the registry, and
      # nothing here is published — so without a stand-in every crate reads as
      # an initial release: no version bump ever, and a changelog replaying the
      # crate's whole history. `--registry-manifest-path` supplies the same
      # baseline from a checkout, which is why this job drives the CLI instead
      # of `release-plz/action` — the action exposes no input for the flag.
      #
      # The tag is a lower bound on released state, never an upper one: too old
      # only costs a wider diff, while too new silently swallows the commits it
      # skipped past.
      - name: Check out the last released tree
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify refs/tags/release-baseline >/dev/null; then
            echo "::error::the release-baseline tag is missing; see Setup in RELEASING.md." >&2
            exit 1
          fi
          # Outside the repo, so it cannot land in the Release PR's own diff.
          git worktree add --detach "$RUNNER_TEMP/released" release-baseline

      - name: Install release-plz
        uses: taiki-e/install-action@cde8c9e634f4a17bc06b61413ac0ef75450eac46
        with:
          # Same version `release-plz/action` pins for the release job.
          tool: release-plz@0.3.160

      - name: Configure the git author
        uses: release-plz/git-config@59144859caf016f8b817a2ac9b051578729173c4
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Open or update the release PR
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          set -euo pipefail
          release-plz release-pr \
            --git-token "$GITHUB_TOKEN" \
            --repo-url "https://github.com/${GITHUB_REPOSITORY}" \
            --forge github \
            --registry-manifest-path "$RUNNER_TEMP/released/Cargo.toml"
