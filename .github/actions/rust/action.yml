name: Setup Rust
description: Install the Rust toolchain and wire up compilation + dependency caching.
inputs:
  targets:
    description: Rust targets to install
    required: false
    default: wasm32-unknown-unknown
  components:
    description: Rust components to install
    required: false
    default: ""
  cache-key:
    description: >-
      rust-cache build class. Jobs that compile the same target/profile should
      pass the same value so their dependency artifacts share ONE cache instead
      of a multi-GB copy per job — GitHub evicts caches once the repo total
      passes 10 GB. Defaults to the job id (a private, per-job cache).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@dd44c20b1206a46e25fba8503d5d7c9a33bd355a
      with:
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        # Cache-factory model: only the default branch (and the merge queue) seed
        # caches; PR runs restore-only. This keeps feature branches from bloating
        # the 10 GB budget or racing to write partial caches, and gives every PR a
        # complete, dev-seeded cache to restore.
        save-if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'merge_group' }}
        # Save even on failure/timeout: a job slow enough to hit its timeout is
        # cancelled before the post-step runs, so it could otherwise never seed a
        # warm cache. CI runs CARGO_INCREMENTAL=0, so there is no incremental
        # state to corrupt.
        cache-on-failure: true
        # Group by build class via `cache-key`, not `github.job`. Do not put raw
        # target/component strings here: rust-cache rejects keys with commas, and
        # comma-separated target lists are common in this repo.
        shared-key: "rust-${{ runner.os }}-${{ inputs.cache-key || github.job }}"
        workspaces: ". -> target"
