# A typo must be an error, not a silently ignored key.
extends = ["../profiles/alpha-mainnet.toml", "../profiles/irs-stable.toml"]
name = "typo-market"
no_such_field = true

[collateral]
asset = "nep141:collateral.near"
symbol = "C"
aggregator = "median_low"
min_sources = 1
sources = [{ kind = "lazer", oracle = "lazer.near", feed_id = 1, weight = 1 }]

[borrow]
asset = "nep141:borrow.near"
symbol = "B"
aggregator = "median_high"
min_sources = 1
sources = [{ kind = "lazer", oracle = "lazer.near", feed_id = 2, weight = 1 }]

[market]
borrow_range = { minimum = "1" }
supply_range = { minimum = "1" }
supply_withdrawal_range = { minimum = "1" }
