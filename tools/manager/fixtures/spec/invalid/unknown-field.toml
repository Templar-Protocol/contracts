# A typo must be an error, not a silently ignored key.
extends = ["../base.toml"]
name = "typo-market"
no_such_field = true

[collateral]
asset = "nep141:collateral.near"
symbol = "C"
aggregator = "median_low"
min_sources = 1
sources = [
    { kind = "lazer", oracle = "lazer.near", feed_id = 1, weight = 1 },
]

[borrow]
asset = "nep141:borrow.near"
symbol = "B"
aggregator = "median_high"
min_sources = 1
sources = [
    { kind = "lazer", oracle = "lazer.near", feed_id = 2, weight = 1 },
]

[market]
mcr_maintenance = "1.25"
mcr_liquidation = "1.2"
maximum_usage_ratio = "0.99"
liquidation_maximum_spread = "0.1"
borrow_range = { minimum = "1 atom" }
supply_range = { minimum = "1 atom" }
supply_withdrawal_range = { minimum = "1 atom" }
