# A minimal complete profile for the spec fixtures.
#
# Local rather than reaching into `deployments/profiles/`: a fixture that
# extends a production profile fails whenever a real market's values change,
# which is a test asserting on something it does not own.
schema = 4

registry = "registry.near"

[versions]
market = "v1.0.0"
proxy_oracle = "proxy-oracle@0.1.0#00"
proxy_governance = "proxy-governance@0.1.0#00"

[governance]
admin = "admin.near"
ttl_default = "0s"

[market]
time_chunk = "10m"
price_maximum_age = "60s"
interest_rate_strategy = { Piecewise = { base = "0", optimal = "0.9", rate_1 = "0.1", rate_2 = "2" } }
origination_fee = { Flat = "0" }
supply_withdrawal_fee = { fee = { Flat = "0" }, duration = "0", behavior = "Fixed" }
yield_weights = { supply = 4, static = { "revenue.near" = 1 } }
protocol_account_id = "revenue.near"
mcr_maintenance = "1.25"
mcr_liquidation = "1.2"
maximum_usage_ratio = "0.99"
liquidation_maximum_spread = "0.1"
borrow_range = { minimum = "1", maximum = "1000" }
supply_range = { minimum = "1" }
supply_withdrawal_range = { minimum = "1" }
