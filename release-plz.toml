## Release automation for the contracts workspace.
##
## Model: release-plz keeps one standing "chore: release" PR that accumulates
## version bumps and CHANGELOG entries as work merges into `dev`. Merging that
## PR is the release trigger (`release_always = false`). Nothing ships on an
## ordinary merge.
##
## Crates fall into three tiers:
##
##   A — published    the closure external consumers import (see below)
##   B — tagged only  contracts, services, tools: real versions, no registry
##   C — internal     build/test scaffolding: no tag, no changelog, no release
##
## ⚠️ Tier A is currently configured IDENTICALLY to Tier B (`git_only = true`).
## Publishing to crates.io is blocked: `templar-common` depends on the RedStone
## Rust SDK as a git dependency (`redstone`, tag 3.1.0-pre1), which is not on
## crates.io, and Cargo refuses to publish any crate with a git dependency. The
## Tier A blocks below are written out explicitly so that unblocking is a
## mechanical flip of `git_only = false` + `publish = true` on each — no code
## changes. See ENG-522. Until then, consumers pin per-crate git tags:
##
##   templar-gateway-client = { git = "https://github.com/Templar-Protocol/contracts", tag = "templar-gateway-client-v0.1.0" }

[workspace]
# Tier B defaults. Versions come from git tags rather than a registry lookup,
# and `cargo publish` is skipped. Applies to every crate not overridden below.
git_only = true

# Must be stated explicitly: release-plz validates its own `publish` setting
# against each `Cargo.toml`, and errors on any crate that has `publish = false`
# there while the config still defaults to `true` — `git_only` alone does not
# satisfy that check.
publish = false

# Batch changes into a Release PR instead of releasing on every merge to `dev`.
release_always = false

# Per-crate tags: `templar-gateway-client-v0.2.0`. Required for independent
# versioning — a bare `v0.2.0` cannot say which crate it refers to.
git_tag_name = "{{ package }}-v{{ version }}"
git_tag_enable = true
git_release_enable = true

changelog_update = true

# cargo-semver-checks needs a published baseline to diff against, and nothing is
# published yet. Turn this on for the Tier A crates at the same time as
# `publish` — it is the guard that stops a breaking change reaching consumers.
semver_check = false

# `cargo update` on every release PR would churn the lockfile independently of
# the actual changes being released.
dependencies_update = false

# ---------------------------------------------------------------------------
# Tier A — published crates (currently git_only; see the note above)
#
# This is the transitive normal-dependency closure of what external consumers
# import, computed from `cargo metadata`. Adding a crate here is a commitment to
# its public API, so keep the set demand-driven.
# ---------------------------------------------------------------------------

[[package]]
name = "templar-common"
git_only = true # → false + publish = true once redstone is resolved

[[package]]
name = "templar-primitives"
git_only = true

[[package]]
name = "templar-universal-account"
git_only = true

[[package]]
name = "templar-curator-primitives"
git_only = true

[[package]]
name = "templar-vault-kernel"
git_only = true

[[package]]
name = "templar-vault-macros"
git_only = true

[[package]]
name = "templar-gateway-client"
git_only = true

[[package]]
name = "templar-gateway-core"
git_only = true

[[package]]
name = "templar-gateway-macros"
git_only = true

[[package]]
name = "templar-gateway-methods-dispatch"
git_only = true

[[package]]
name = "templar-gateway-methods-spec"
git_only = true

[[package]]
name = "templar-gateway-store"
git_only = true

[[package]]
name = "templar-gateway-types"
git_only = true

[[package]]
name = "templar-proxy-oracle-kernel"
git_only = true

[[package]]
name = "templar-proxy-oracle-governance-kernel"
git_only = true

[[package]]
name = "templar-proxy-oracle-near-common"
git_only = true

[[package]]
name = "templar-proxy-oracle-near-governance-common"
git_only = true

# ---------------------------------------------------------------------------
# Tier C — internal scaffolding. No tag, no changelog, no GitHub Release.
#
# These exist to make the build and test suite work. They have no consumer whose
# expectations a version could violate, so a version number would be noise.
# `templar-contract-artifacts` is here deliberately: it changes on *every*
# contract release, so its own version says nothing — the meaningful versions
# live in the per-artifact release list in `contract/artifacts/src/ids.rs`.
# ---------------------------------------------------------------------------

[[package]]
name = "templar-contract-artifacts"
release = false

[[package]]
name = "templar-fuzz"
release = false

[[package]]
name = "test-utils"
release = false

[[package]]
name = "templar-proxy-oracle-soroban-integration-tests"
release = false

[[package]]
name = "mock-ft"
release = false

[[package]]
name = "mock-mt"
release = false

[[package]]
name = "mock-oracle"
release = false

[[package]]
name = "mock-receiver"
release = false

[[package]]
name = "mock-ref"
release = false

# ---------------------------------------------------------------------------
# Changelog rendering. Groups mirror the commit types the PR-title lint accepts
# (.github/workflows/pr-title.yml) — keep the two in sync.
# ---------------------------------------------------------------------------

[changelog]
protect_breaking_commits = true
sort_commits = "oldest"

commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^deploy", group = "Deployments" },
  { message = "^docs", group = "Documentation" },
  # Housekeeping that does not change shipped behaviour. Kept out of the
  # changelog, but still counted for the version bump.
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
  { message = "^chore", skip = true },
]
