[package]
name = "templar-vault-macros"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Shared procedural macros for Templar vault crates"
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["parsing"] }
