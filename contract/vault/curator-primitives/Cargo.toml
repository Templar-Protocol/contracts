[package]
name = "templar-curator-primitives"
version = "1.0.1"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Chain-agnostic curator policy and recovery primitives for Templar Protocol vaults"
repository.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
std = ["borsh-schema"]
borsh = ["dep:borsh", "templar-vault-kernel/borsh"]
borsh-schema = ["borsh", "borsh/unstable__schema", "templar-vault-kernel/borsh-schema"]
postcard = ["dep:postcard", "serde", "templar-vault-kernel/postcard"]
serde = ["dep:serde", "templar-vault-kernel/serde"]
schemars = ["dep:schemars", "templar-vault-kernel/schemars"]
boundary = ["dep:near-sdk", "borsh-schema", "serde"]
boundary-test = ["boundary", "near-sdk/unit-testing"]
# Kernel action profile gates (forwarded; curator policy surface mirrors the
# selected kernel action set exactly). Immediate action features keep the
# origin/dev policy surface. Epoch settlement adds the epoch action kinds.
action-immediate-deposit = ["templar-vault-kernel/action-immediate-deposit"]
action-atomic-exit = ["templar-vault-kernel/action-atomic-exit"]
action-recovery = ["templar-vault-kernel/action-recovery"]
action-sync-external = ["templar-vault-kernel/action-sync-external"]
action-refresh-fees = ["templar-vault-kernel/action-refresh-fees"]
action-pause = ["templar-vault-kernel/action-pause"]
action-allocation-lifecycle = ["templar-vault-kernel/action-allocation-lifecycle"]
action-refresh-lifecycle = ["templar-vault-kernel/action-refresh-lifecycle"]
action-epoch-settlement = ["templar-vault-kernel/action-epoch-settlement"]
all-actions = [
    "templar-vault-kernel/all-actions",
    "action-immediate-deposit",
    "action-atomic-exit",
    "action-recovery",
    "action-sync-external",
    "action-refresh-fees",
    "action-pause",
    "action-allocation-lifecycle",
    "action-refresh-lifecycle",
    "action-epoch-settlement",
]
# Recovery action helpers (determine_recovery_action, handle_*_failure, etc.)
recovery = []

[dependencies]
# Core dependency - vault kernel types
templar-vault-kernel = { path = "../kernel", version = "1.0.1", default-features = false }
templar-vault-macros.workspace = true
derive_more.workspace = true
typed-builder = "0.20"

# Optional serialization dependencies (no_std + alloc)
borsh = { version = "1.5", optional = true, default-features = false, features = ["derive"] }
serde = { version = "1.0", optional = true, default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", optional = true, default-features = false, features = ["alloc"] }
schemars = { version = "0.8", optional = true }
near-sdk = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1.4"
rstest.workspace = true
