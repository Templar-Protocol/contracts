[package]
name = "templar-vault-kernel"
version = "1.0.1"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Storage-agnostic vault kernel: actions, effects, and state transitions"
repository.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
# NEAR-specific effect variants (ExternalCall/ChargeStorage).
near = []
# Optional serialization helpers (no_std + alloc).
borsh = ["dep:borsh"]
postcard = ["dep:postcard", "serde"]
# Enable Borsh schema generation (adds code size, only needed for NEAR).
borsh-schema = ["borsh", "borsh/unstable__schema"]
std = []
serde = ["dep:serde"]
schemars = ["dep:schemars"]
# Strip KernelEvent Serialize/Clone for minimal WASM size in Soroban builds.
soroban = []

# ── Action handler gates ──────────────────────────────────────────
# Existing action variants remain present for ABI compatibility. Disabled
# handlers return KernelError::NotImplemented. Epoch-only variants and state
# exist only with action-epoch-settlement.
#
# Deposit assets immediately and mint shares.
action-immediate-deposit = []
# AtomicWithdraw and AtomicRedeem.
action-atomic-exit = []
# AbortAllocating, AbortRefreshing, AbortWithdrawing, EmergencyReset
action-recovery = []
# SyncExternalAssets
action-sync-external = []
# RefreshFees
action-refresh-fees = []
action-pause = []
action-allocation-lifecycle = []
action-refresh-lifecycle = []
# BeginEpochCutoff, SettleEpoch, CancelPendingWithdrawal
action-epoch-settlement = []
all-actions = [
    "action-immediate-deposit",
    "action-atomic-exit",
    "action-recovery",
    "action-sync-external",
    "action-refresh-fees",
    "action-pause",
    "action-allocation-lifecycle",
    "action-refresh-lifecycle",
    "action-epoch-settlement",
]
[dependencies]
derive_more.workspace = true
primitive-types = { version = "0.14.0", default-features = false }
templar-vault-macros.workspace = true

borsh = { version = "1.5", optional = true, default-features = false, features = ["derive"] }
serde = { version = "1.0", optional = true, default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", optional = true, default-features = false, features = ["alloc"] }
schemars = { version = "0.8", optional = true }

[dev-dependencies]
proptest = "1.4"
serde_json.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
