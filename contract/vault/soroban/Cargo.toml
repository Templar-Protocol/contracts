[package]
name = "templar-soroban-runtime"
version = "1.1.1"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Soroban effect interpreter and runtime for Templar Protocol vaults"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = ["immediate-entrypoints"]
std = []
testutils = ["soroban-sdk/testutils"]
# Default immediate product: origin/dev contract ABI, legacy queue schema,
# immediate deposit/atomic-exit law, and the five production kernel action
# gates. This is the shipped deploy profile.
immediate-entrypoints = [
    "templar-soroban-shared-types/immediate-commands",
    "templar-vault-kernel/action-immediate-deposit",
    "templar-vault-kernel/action-atomic-exit",
    "action-recovery",
    "action-sync-external",
    "action-refresh-fees",
    "action-allocation-lifecycle",
    "action-refresh-lifecycle",
]
# Opt-in epoch settlement library: intake custody, cutoff, report-bound
# settlement, admission, and cancellation law. Never enabled by default; the
# immediate deploy artifact contains no epoch code or storage keys.
epoch = [
    "templar-soroban-shared-types/epoch-commands",
    "templar-vault-kernel/action-epoch-settlement",
    "templar-curator-primitives/action-epoch-settlement",
]
action-recovery = [
    "templar-vault-kernel/action-recovery",
    "templar-curator-primitives/action-recovery",
]
action-sync-external = [
    "templar-vault-kernel/action-sync-external",
    "templar-curator-primitives/action-sync-external",
]
action-refresh-fees = [
    "templar-vault-kernel/action-refresh-fees",
    "templar-curator-primitives/action-refresh-fees",
]
action-allocation-lifecycle = [
    "templar-vault-kernel/action-allocation-lifecycle",
    "templar-curator-primitives/action-allocation-lifecycle",
]
action-refresh-lifecycle = [
    "templar-vault-kernel/action-refresh-lifecycle",
    "templar-curator-primitives/action-refresh-lifecycle",
]
action-pause = [
    "templar-vault-kernel/action-pause",
    "templar-curator-primitives/action-pause",
]
action-immediate-deposit = [
    "templar-vault-kernel/action-immediate-deposit",
    "templar-curator-primitives/action-immediate-deposit",
]
action-atomic-exit = [
    "templar-vault-kernel/action-atomic-exit",
    "templar-curator-primitives/action-atomic-exit",
]

[dependencies]
# Core dependency - vault kernel types
templar-vault-kernel = { path = "../kernel", default-features = false, features = ["postcard", "soroban"] }

templar-curator-primitives = { path = "../curator-primitives", default-features = false, features = ["postcard"] }
templar-soroban-shared-types = { path = "./shared-types", default-features = false }
derive_more.workspace = true
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

# Soroban SDK for Stellar smart contracts
soroban-sdk = { version = "25.3.0", features = ["alloc", "experimental_spec_shaking_v2"] }

[dev-dependencies]
proptest = "1.4"
soroban-sdk = { version = "25.3.0", features = ["testutils", "alloc", "experimental_spec_shaking_v2"] }
rstest.workspace = true
blend-contract-sdk = { version = "2.25.0", features = ["testutils"] }
templar-soroban-blend-adapter = { path = "./blend-adapter" }
templar-soroban-runtime = { path = ".", default-features = false, features = ["testutils"] }
templar-soroban-governance = { path = "./governance" }
