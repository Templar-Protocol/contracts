[package]
name = "templar-proxy-oracle-soroban-common"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
version = "0.1.4"

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
soroban-sdk = { version = "25.0.1", features = ["alloc"] }
templar-primitives = { path = "../../../../primitives", version = "0.1.3", default-features = false }
templar-proxy-oracle-kernel = { path = "../../kernel", version = "0.1.4", default-features = false }

[dev-dependencies]
rstest.workspace = true
soroban-sdk = { version = "25.0.1", features = ["testutils", "alloc"] }

[lints]
workspace = true
