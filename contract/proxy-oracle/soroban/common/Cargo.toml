[package]
name = "templar-proxy-oracle-soroban-common"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
version = "0.1.2"

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[features]
owner-upgrade = ["dep:stellar-access"]

[dependencies]
soroban-sdk = { version = "25.0.1", features = ["alloc"] }
stellar-access = { version = "0.7.1", optional = true }
templar-primitives = { path = "../../../../primitives", default-features = false }

[dev-dependencies]
rstest.workspace = true
soroban-sdk = { version = "25.0.1", features = ["testutils", "alloc"] }

[lints]
workspace = true
