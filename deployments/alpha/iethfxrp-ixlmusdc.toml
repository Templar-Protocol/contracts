# Deploys its own proxy oracle, so this market creates a governance contract,
# the oracle it owns, and the market itself.
#
# `decimals` is stated on both sides so the offline `config.validate` check can
# run without an on-chain metadata lookup (ENG-541). It is the same value that
# lookup will reconcile against.
extends = ["../profiles/alpha.toml", "../profiles/irs-stable.toml"]

name = "iethfxrp-ixlmusdc"

[collateral]
asset = "nep245:intents.near:nep141:eth-0xce6170ea245dc8d1f275a710a062b70f125f0110.omft.near"
symbol = "FXRP"
# Bridged; priced as XRP. Pinning records that assertion.
reference = { coin_gecko = { id = "ripple" } }
decimals = 6
aggregator = "median_low"
min_sources = 1
sources = [
    { kind = "lazer", oracle = "pyth-lazer.templar-alpha.near", feed_id = 14, weight = 8 },
    { kind = "red_stone", oracle = "redstone-adapter.v1.tmplr.near", price_id = "XRP", weight = 2 },
]

[borrow]
asset = "nep245:intents.near:nep245:v2_1.omni.hot.tg:1100_111bzQBB65GxAPAVoxqmMcgYo5oS3txhqs1Uh1cgahKQUeTUq1TJu"
symbol = "USDC"
reference = { coin_gecko = { id = "usd-coin" } }
decimals = 7
aggregator = "median_high"
min_sources = 1
sources = [
    { kind = "lazer", oracle = "pyth-lazer.templar-alpha.near", feed_id = 7, weight = 8 },
    { kind = "red_stone", oracle = "redstone-adapter.v1.tmplr.near", price_id = "USDC", weight = 2 },
]

[market]
mcr_maintenance = "1.25"
mcr_liquidation = "1.2"
maximum_usage_ratio = "0.99"
liquidation_maximum_spread = "0.1"
price_maximum_age = "60s"
borrow_range = { minimum = "1 atom" }
# Deployed at a tenth of the 0.04 every other market floors at: the raw
# 40000 came from a 6-decimal profile and this borrow asset has 7. The
# configuration is immutable after init, so this records what is on chain.
supply_range = { minimum = "0.004 tokens" }
supply_withdrawal_range = { minimum = "0.004 tokens" }
