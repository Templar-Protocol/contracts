# Deploys its own proxy oracle, so this market creates a governance contract,
# the oracle it owns, and the market itself.
extends = ["../profiles/alpha.toml", "../profiles/irs-stable.toml"]

name = "iethsusde-iethusde"

[collateral]
asset = "nep245:intents.near:nep141:eth-0x9d39a5de30e57443bff2a8307a4256c8797a3497.omft.near"
symbol = "sUSDe"
reference = { coin_gecko = { id = "ethena-staked-usde" } }
decimals = 18
aggregator = "median_low"
min_sources = 1
sources = [
    { kind = "lazer", oracle = "pyth-lazer.templar-alpha.near", feed_id = 582, weight = 8 },
    { kind = "red_stone", oracle = "redstone-adapter.v1.tmplr.near", price_id = "sUSDe", weight = 2 },
]

[borrow]
asset = "nep245:intents.near:nep141:eth-0x4c9edd5852cd905f086c759e8383e09bff1e68b3.omft.near"
symbol = "USDe"
reference = { coin_gecko = { id = "ethena-usde" } }
decimals = 18
aggregator = "median_high"
min_sources = 1
sources = [
    { kind = "lazer", oracle = "pyth-lazer.templar-alpha.near", feed_id = 204, weight = 8 },
    { kind = "red_stone", oracle = "redstone-adapter.v1.tmplr.near", price_id = "USDe", weight = 2 },
]

[market]
mcr_maintenance = "1.2"
mcr_liquidation = "1.15"
maximum_usage_ratio = "0.99"
liquidation_maximum_spread = "0.1"
borrow_range = { minimum = "1 atom" }
supply_range = { minimum = "0.04 tokens" }
supply_withdrawal_range = { minimum = "0.04 tokens" }
# A 10% protocol share of interest, against the profile's 20%.
yield_weights = { supply = 9, static = { "revenue.tmplr.near" = 1 } }
