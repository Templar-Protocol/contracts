# XRP, held through NEAR Intents (`ixrp`), as the collateral asset of a v1
# market that deploys its own proxy oracle.
#
# `ixrp-ixlmusdc` is the only v1 market holding it today, and this profile
# does not describe it: that market still reads the Pyth oracle, which is
# being retired in favor of Lazer. Adopting this profile is the migration.
[collateral]
asset = "nep245:intents.near:nep141:xrp.omft.near"
symbol = "XRP"
reference = { coin_gecko = { id = "ripple" } }
decimals = 6
aggregator = "median_low"
min_sources = 1
sources = [
    { kind = "lazer", oracle = "pyth-lazer.v1.tmplr.near", feed_id = 14, weight = 8 },
    { kind = "red_stone", oracle = "redstone-adapter.v1.tmplr.near", price_id = "XRP", weight = 2 },
]
