# ADA, held through NEAR Intents (`iada`), as the collateral asset of a v1
# market that deploys its own proxy oracle.
#
# `iada-ixlmusdc` is the only v1 market holding it today, and this profile
# does not describe it: that market still reads the Pyth oracle, which is
# being retired in favor of Lazer. Adopting this profile is the migration.
[collateral]
asset = "nep245:intents.near:nep141:cardano.omft.near"
symbol = "ADA"
reference = { coin_gecko = { id = "cardano" } }
decimals = 6
aggregator = "median_low"
min_sources = 1
sources = [
    { kind = "lazer", oracle = "pyth-lazer.v1.tmplr.near", feed_id = 16, weight = 8 },
    { kind = "red_stone", oracle = "redstone-adapter.v1.tmplr.near", price_id = "ADA", weight = 2 },
]
