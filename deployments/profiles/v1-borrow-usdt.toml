# Native NEAR USDT as the borrow asset of a v1 market that deploys its own
# proxy oracle. Shared by `linear-usdt` and `stnear-usdt`.
#
# Deliberately not shaped like `v1-borrow-ixlmusdc.toml`: no deployed v1
# market prices USDT through Lazer, so there is no feed id to name here and no
# second source to weigh against. A single Pyth source under `median_low` is
# what is actually deployed; inventing a Lazer leg would put a feed nobody has
# configured into every market that extends this.
[borrow]
asset = "nep141:usdt.tether-token.near"
symbol = "USDT"
reference = { coin_gecko = { id = "tether" } }
decimals = 6
aggregator = "median_low"
min_sources = 1
sources = [
    { kind = "pyth", oracle = "pyth-oracle.near", price_id = "2b89b9dc8fdf9f34709a5b106b472f0f39bb6ca9ce04b0fd7f2e971688e2e53b", weight = 1 },
]
