# Native NEAR USDT as the borrow asset of a v1 market that deploys its own
# proxy oracle.
#
# `linear-usdt` and `stnear-usdt` are the v1 markets borrowing it today, and
# this profile does not describe either: both read a single Pyth source, which
# is being retired in favor of Lazer. Adopting this profile is the migration,
# and it adds the RedStone leg those markets have never had.
[borrow]
asset = "nep141:usdt.tether-token.near"
symbol = "USDT"
reference = { coin_gecko = { id = "tether" } }
decimals = 6
aggregator = "median_low"
min_sources = 1
sources = [
    { kind = "lazer", oracle = "pyth-lazer.v1.tmplr.near", feed_id = 8, weight = 8 },
    { kind = "red_stone", oracle = "redstone-adapter.v1.tmplr.near", price_id = "USDT", weight = 2 },
]
