# Shared by every alpha market. These values were duplicated across each
# market's `env.sh` and `market-args.json` before the spec existed.
schema = 5

registry = "templar-alpha.near"

[versions]
market = "v1.3.0"
proxy_oracle = "templar-proxy-oracle-near-contract@0.3.0#d2e62c4566c98e55121a5aad32e0e5b8cfb911f82aca71dbaeaa83794fed9e8e"
proxy_governance = "templar-proxy-oracle-near-governance-contract@0.1.0#92b67071d9e35875bd680c0a05c16316ccd6edace8818c62e62b996c3f2393a2"

[governance]
admin = "templar-alpha.near"
ttl_default = "0s"

[market]
time_chunk = "10m"
price_maximum_age = "60s"
# 1.5% band for the third-party price cross-check.
reference_tolerance = "0.015"
origination_fee = { Flat = "0 atoms" }
supply_withdrawal_fee = { fee = { Flat = "0 atoms" }, duration = "0", behavior = "Fixed" }
yield_weights = { supply = 4, static = { "revenue.tmplr.near" = 1 } }
protocol_account_id = "revenue.tmplr.near"
