[package]
name = "templar-gateway-testing"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
base64.workspace = true
near-api.workspace = true
near-crypto.workspace = true
near-jsonrpc-client = { workspace = true, features = ["sandbox"] }
near-primitives.workspace = true
near-sdk = { workspace = true, features = ["unit-testing"] }
near-sandbox.workspace = true
near-token.workspace = true
reqwest.workspace = true
rstest.workspace = true
serde.workspace = true
serde_json.workspace = true
templar-common.workspace = true
# `fetch` backs `wasm::released()`: migration and upgrade tests deploy the real
# historical bytes, downloaded from each version's GitHub Release and verified
# against the catalog's SHA-256 pin.
templar-contract-artifacts = { workspace = true, features = [
    "workspace-loader",
    "fetch",
] }
templar-gateway-client.workspace = true
templar-gateway-core.workspace = true
templar-gateway-methods-dispatch.workspace = true
templar-gateway-methods-spec.workspace = true
templar-gateway-runtime.workspace = true
templar-gateway-types.workspace = true
templar-primitives.workspace = true
templar-proxy-oracle-kernel.workspace = true
templar-proxy-oracle-near-common.workspace = true
templar-pyth-lazer-adapter-contract.workspace = true
templar-proxy-oracle-near-governance-common.workspace = true
templar-universal-account.workspace = true
test-utils.workspace = true
tokio.workspace = true

[lints]
workspace = true
