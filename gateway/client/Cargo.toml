[package]
name = "templar-gateway-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
near-account-id.workspace = true
near-api.workspace = true
url.workspace = true
templar-common.workspace = true
templar-gateway-core.workspace = true
templar-gateway-methods-dispatch.workspace = true
templar-gateway-oracle-updates-dispatch.workspace = true
templar-gateway-oracle-updates-spec.workspace = true
templar-gateway-store.workspace = true
templar-gateway-types.workspace = true

[features]
# Derive `clap::ValueEnum` on `Network` and expose the shared `OracleSourceArgs`
# (`clap::Args`) so CLI consumers can wire the oracle payload sources directly.
clap = ["dep:clap", "dep:anyhow"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
