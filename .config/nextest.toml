# Test-group filters and setup orchestration live in the root justfile. Nextest
# profiles define execution behavior only; invoke tests through `just test-*`.

[profile.default]
# Limit test threads to reduce memory/disk usage
test-threads = 4

# Reduce retries to save disk space
retries = 0

# Fail closed when nextest is invoked directly. Just recipes always provide one
# of the repository's explicit test-group filters.
default-filter = "none()"

[profile.ci]
# CI-specific profile balancing disk space and performance.
test-threads = 6
retries = 1

# Don't stop at the first failure — surface the whole suite's results in one run.
fail-fast = false

# Show output for failed tests only to reduce log size
status-level = "fail"

# Set slower timeout for CI runners
slow-timeout = { period = "120s", terminate-after = 3 }

[profile.sandbox]
# Parallel across a pool of neard nodes started by `just test-sandbox`. Each test
# attaches to the node for its NEXTEST_TEST_GLOBAL_SLOT. Exclusive use per slot
# keeps fast_forward and chain state isolated between concurrent tests, while
# reusing a node avoids per-test boot and teardown. test-threads MUST be <=
# SANDBOX_NODE_COUNT (default 4; keep them in sync).
test-threads = 4
slow-timeout = { period = "120s", terminate-after = 5 }

# Profiles inherit from `default`, not from `ci`, so this has to be set here too:
# CI runs the node suite through this profile and needs the full picture from one
# run, not an abort on the first failure.
fail-fast = false

[store]
# Location of nextest's run store (metadata + archived test outputs).
dir = "target/nextest"
