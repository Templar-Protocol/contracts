# Hand-maintained annotations for docs/src/release-log.md.
#
# One table per catalog row, keyed `<artifact>@<version>` exactly as the row
# appears in `contract/artifacts/releases/`. Every key is optional; a cell the
# generator cannot fill renders as **Input needed** so the gap is visible on
# the published page rather than silently blank.
#
#   registry_key  the key this build is registered under in `v1.tmplr.near`
#                 (`list_versions`), or the `<package>@<version>#<sha256>` key
#                 a deployment profile pins
#   audit         the audit engagement(s) whose scope covers this build
#   note          free text shown in the Notes column

